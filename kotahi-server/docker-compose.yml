version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: video-player-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: video_player
    volumes:
      - mongodb_data:/data/db
    networks:
      - video-player-network

  backend:
    build: .
    container_name: video-player-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/video_player?authSource=admin
      MONGODB_DATABASE: video_player
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
    volumes:
      - vtt_uploads:/app/uploads/vtt
    depends_on:
      - mongodb
    networks:
      - video-player-network

  frontend:
    build: ../kotahi-app
    container_name: video-player-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      - backend
    networks:
      - video-player-network

volumes:
  mongodb_data:
  vtt_uploads:

networks:
  video-player-network:
    driver: bridge
